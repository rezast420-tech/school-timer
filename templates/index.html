<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شمارش معکوس تا اول مهر</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

* {
    box-sizing: border-box;
}

body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #ffffff;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    font-size: 2.2em;
    line-height: 1.8;
    margin-bottom: 30px;
    max-width: 900px;
}

#timer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    background: rgba(0,0,0,0.35);
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

.time-box {
    min-width: 100px;
    padding: 10px;
    text-align: center;
    font-size: 2em;
    font-weight: 900;
}

.label {
    display: block;
    font-size: 0.55em;
    margin-top: 8px;
    color: #ffd700;
}

.name {
    display: block;
    font-size: 2em;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(0,0,0,0.5);
    margin-top: 25px;
}

.finished {
    font-size: 1.8em;
    line-height: 1.8;
    padding: 10px;
}

@media (max-width: 600px) {

    h1 {
        font-size: 1.35em;
        margin-bottom: 20px;
    }

    #timer {
        gap: 5px;
        padding: 15px;
        width: 100%;
    }

    .time-box {
        min-width: 70px;
        font-size: 1.5em;
    }

    .label {
        font-size: 0.55em;
    }

    .name {
        font-size: 1.5em;
    }
}
</style>
</head>

<body>

<h1>
شمارش معکوس تا اول مهر ۱۴۰۵
<br>
مهر متفاوت؛ آغاز فصل تازه با تلاش و امید نو
<br>
همراه با همدلی
</h1>

<div id="timer">در حال بارگذاری...</div>

<span class="name">دبستان شقایق</span>

<script>

// 1 Mehr 1405 = 23 September 2026
// School starts at 07:30 Iran time = 04:00 UTC

const countdownDate =
    new Date(Date.UTC(2026, 8, 23, 4, 0, 0)).getTime();

function updateTimer() {

    const now = new Date().getTime();

    const distance = countdownDate - now;

    if (distance <= 0) {

        document.getElementById("timer").innerHTML = `
            <div class="finished">
                🌸 مهر با مهربانی آغاز می‌شود 🌸
                <br>
                🎉 سال تحصیلی جدید مبارک 🎉
            </div>
        `;

        return;
    }

    const days =
        Math.floor(distance / (1000 * 60 * 60 * 24));

    const hours =
        Math.floor(
            (distance % (1000 * 60 * 60 * 24))
            / (1000 * 60 * 60)
        );

    const minutes =
        Math.floor(
            (distance % (1000 * 60 * 60))
            / (1000 * 60)
        );

    const seconds =
        Math.floor(
            (distance % (1000 * 60))
            / 1000
        );

    document.getElementById("timer").innerHTML = `

        <div class="time-box">
            ${days}
            <span class="label">روز</span>
        </div>

        <div class="time-box">
            ${hours}
            <span class="label">ساعت</span>
        </div>

        <div class="time-box">
            ${minutes}
            <span class="label">دقیقه</span>
        </div>

        <div class="time-box">
            ${seconds}
            <span class="label">ثانیه</span>
        </div>

    `;
}

updateTimer();

setInterval(updateTimer, 1000);

</script>

</body>
</html>
